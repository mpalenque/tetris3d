    .level-label {
      font-family: 'DM Sans', sans-serif;
      font-weight: 200;
      font-size: 40px;
      color: #dcee2d;
      letter-spacing: -0.44px;
      line-height: 1.5;
    }

    .level-number {
      font-family: 'DM Sans', sans-serif;

    }

    }

      font-family: 'DM Sans', sans-serif;
      font-weight: 200;
      font-size: 42px;
      letter-spacing: -0.462px;
      line-height: 1.5;
      z-index: 2;
      position: relative;
      mix-blend-mode: color-dodge;

    .zone-red {
      background: #cf4526;
    }

    .zone-red .zone-text {
      color: #cf4526;
    }

    .zone-blue {
      background: #21b1f8;
    }

    .zone-blue .zone-text {
      color: #21b1f8;
    }

    .zone-green {
      background: #47ebcd;
    }

    .zone-green .zone-text {
      color: #47ebcd;
    }

    /* === ESPACIO CENTRAL (transparente para ver Needle) === */
    .game-scene-spacer {
      flex: 1;
      pointer-events: none;
    }

    /* === BOTTOM FOOTER === */
    .game-footer {
      flex-shrink: 0;

      border: 3px solid #dcee2d;
      border-top: 2px solid #dcee2d;
      height: 250px;
      z-index: 100;

      justify-content: center;

      display: flex;
      animation: bonusPulse 1s ease-in-out infinite;
    }

    @keyframes bonusPulse {
      0%, 100% { 
        transform: scale(1);
        filter: drop-shadow(0 0 20px rgba(220, 238, 45, 0.8));

    .logo-container {

      position: absolute;

    }

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip-path: inset(100% 0 0 0);
      transition: clip-path 0.5s ease-out;
      filter: brightness(1.2) saturate(1.3);
    }

    .logo-fill.filled {
      filter: brightness(1.5) saturate(1.5) drop-shadow(0 0 15px #dcee2d) drop-shadow(0 0 30px #dcee2d);
      animation: logoGlow 2s ease-in-out infinite;
    }

    @keyframes logoGlow {
      0%, 100% {
        filter: brightness(1.5) saturate(1.5) drop-shadow(0 0 15px #dcee2d) drop-shadow(0 0 30px #dcee2d);
      }
      50% {
        filter: brightness(1.8) saturate(1.8) drop-shadow(0 0 20px #dcee2d) drop-shadow(0 0 40px #dcee2d);
      }
    }

    .overlay-screens {
      position: absolute;
      top: 0;
      left: 0;

      height: 100%;

    }

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;

    #gameover-screen .gameover-message {

  <link rel="modulepreload" crossorigin href="./assets/three@0.169.11.js">
  <link rel="modulepreload" crossorigin href="./assets/three-examples.7b8c1dbd.js">
  <link rel="modulepreload" crossorigin href="./assets/gltf-progressive.8ea06876.js">
</head>

<body>
  <script>/* needle: fix for peerjs */ window.global = window; var parcelRequire;</script>

  <!-- Needle Engine SIEMPRE en el body (carga correctamente) -->
  <needle-engine></needle-engine>

  <!-- Flash overlay para efecto visual de bonus -->
  <div id="bonus-flash-overlay"></div>

  <!-- UI OVERLAY: Header + Footer + Pantallas -->
  <div class="ui-overlay">
    <!-- Layout Principal: Header + Espacio + Footer -->
    <div class="game-ui-container">
      <!-- TOP HEADER (visible solo durante el juego) -->
      <div id="game-header" class="game-header">
        <!-- Título y Level -->
        <div class="header-title-section">
          <div class="game-title">Name of the Game</div>
          <div class="game-level-container">
            <div class="level-label">LEVEL</div>
            <div class="level-number">1</div>
          </div>
        </div>
        
        <!-- Línea amarilla separadora -->
        <div class="yellow-separator"></div>
        
        <!-- Zonas de colores con texto -->
        <div class="color-zones">
          <div class="zone zone-red">
            <span class="zone-text">PUBLIC</span>
          </div>
          <div class="zone zone-blue">
            <span class="zone-text">PRIVATE</span>
          </div>
          <div class="zone zone-green">
            <span class="zone-text">ON PREM</span>
          </div>
        </div>
      </div>

      <!-- ESPACIO CENTRAL (transparente para ver Needle Engine) -->
      <div class="game-scene-spacer"></div>

      <!-- BOTTOM FOOTER (Score durante el juego) -->
      <div id="game-footer" class="game-footer">
        <div class="footer-content">
          <div class="score-display">
            <div class="score-label">Score</div>
            <div class="score-value current-score">0000000</div>
          </div>
          
          <!-- YELLOW BONUS INDICATOR -->
          <div id="yellow-bonus-indicator" class="yellow-bonus-indicator">
            <div class="bonus-text" id="bonus-text">BONUS: 5</div>
          </div>
          
          <div class="arrow-indicator">
            <!-- Union logo from Figma con efecto de llenado -->
            <div class="logo-container">
              <img class="logo-base" src="./assets/union-logo.b2d6715f.svg" alt="Union Logo Base" />
              <img class="logo-fill" id="logo-fill" src="./assets/union-logo.b2d6715f.svg" alt="Union Logo Fill" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PANTALLAS FULLSCREEN (IDLE, INTRO, GAME OVER, SCOREBOARD) -->
    <div class="overlay-screens">
      <!-- Pantalla IDLE -->
      <div id="idle-screen" class="screen">
        <div class="idle-message">PRESS ANY BUTTON TO PLAY</div>
        <div class="subtitle">Game</div>
      </div>

      <!-- Pantalla INTRO -->
      <div id="intro-screen" class="screen">
        <div class="intro-message">GET READY!</div>
        <div class="countdown">3</div>
      </div>

      <!-- Pantalla GAME OVER -->
      <div id="gameover-screen" class="screen">
        <div class="gameover-message">GAME OVER</div>
        <div style="display: flex; gap: 80px; margin-top: 40px;">
          <div style="display: flex; flex-direction: column; align-items: flex-start;">
            <div class="final-lines">Lines</div>
            <div class="final-lines-value">000</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-start;">
            <div class="final-score">Score</div>
            <div class="final-score-value">0000</div>
          </div>
        </div>
        <div class="restart-hint">Press any key to continue...</div>
      </div>

      <!-- Pantalla SCOREBOARD -->
      <div id="scoreboard-screen" class="screen">
        <div class="scoreboard-title">🏆 High Scores 🏆</div>
        <div class="scoreboard-list">
          <!-- Se llenará dinámicamente desde GameStateManager -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // Función para escalar la UI manteniendo la proporción de 1166x1920
    function scaleUI() {
      const baseWidth = 1166;
      const baseHeight = 1920;
      
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      // Calcular la escala que mejor se ajuste
      const scaleX = windowWidth / baseWidth;
      const scaleY = windowHeight / baseHeight;
      const scale = Math.min(scaleX, scaleY);
      
      // Aplicar la escala a needle-engine y ui-overlay
      const needleEngine = document.querySelector('needle-engine');
      const uiOverlay = document.querySelector('.ui-overlay');
      
      if (needleEngine) {
        needleEngine.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
      
      if (uiOverlay) {
        uiOverlay.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }
    }
    
    // Escalar al cargar la página
    window.addEventListener('load', scaleUI);
    
    // Escalar cuando cambie el tamaño de la ventana
    window.addEventListener('resize', scaleUI);
    
    // Llamar inmediatamente para evitar flash de contenido sin escalar
    scaleUI();

    // === SISTEMA DE LLENADO DEL LOGO ===
    // Esta función será llamada desde GameStateManager
    window.updateLogoFill = function(score, maxScore = 9999999) {
      const logoFill = document.getElementById('logo-fill');
      if (!logoFill) return;
      
      // Calcular porcentaje (0-100)
      const percentage = Math.min(100, (score / maxScore) * 100);
      
      // El clip-path va desde el fondo (100%) hacia arriba (0%)
      // inset(top right bottom left)
      const topInset = 100 - percentage;
      logoFill.style.clipPath = `inset(${topInset}% 0 0 0)`;
      
      // Agregar clase 'filled' para el efecto de brillo cuando está lleno
      if (percentage >= 100) {
        logoFill.classList.add('filled');
      } else {
        logoFill.classList.remove('filled');
      }
    };

    // === SISTEMA DE INDICADOR DE BONUS AMARILLO ===
    // Esta función será llamada desde TetrisGame
    window.showYellowBonus = function(timeRemaining) {
      const bonusIndicator = document.getElementById('yellow-bonus-indicator');
      const bonusText = document.getElementById('bonus-text');
      
      if (!bonusIndicator || !bonusText) return;
      
      // Mostrar el indicador con la clase 'active'
      bonusIndicator.classList.add('active');
      
      // Actualizar el texto con el tiempo restante (redondeado) - sin emojis
      const seconds = Math.ceil(timeRemaining);
      bonusText.textContent = `BONUS: ${seconds}`;
    };

    window.hideYellowBonus = function() {
      const bonusIndicator = document.getElementById('yellow-bonus-indicator');
      if (!bonusIndicator) return;
      
      // Ocultar el indicador removiendo la clase 'active'
      bonusIndicator.classList.remove('active');
    };

    // === SISTEMA DE NIVEL ===
    // Esta función será llamada desde TetrisGame
    window.updateLevel = function(level) {
      const levelNumber = document.querySelector('.level-number');
      if (!levelNumber) return;
      
      // Actualizar el número de nivel
      levelNumber.textContent = level;
      console.log(`📊 UI actualizado: Nivel ${level}`);
    };

    // === SISTEMA DE MÚSICA (MIDI PLAYER) ===
    var midiPlayer = null;
    var musicStarted = false;
    var musicTempo = 1.0;
    
    // Inicializar el reproductor MIDI inmediatamente (como en chiplayer)
    try {
      console.log('🎵 Inicializando reproductor MIDI...');
      console.log('🔍 MIDIPlayer disponible:', typeof MIDIPlayer);
      console.log('🔍 MIDIFile disponible:', typeof MIDIFile);
      console.log('🔍 WebAudioFontPlayer disponible:', typeof WebAudioFontPlayer);
      
      midiPlayer = new MIDIPlayer();
      midiPlayer.autoReplay = true; // Loop infinito
      
      // Cuando la canción se carga
      midiPlayer.onload = function(song){
        console.log('🎵 Canción cargada exitosamente, duración:', song.duration);
      }
      
      // Manejar errores de carga
      midiPlayer.onerror = function(error){
        console.error('❌ Error cargando música:', error);
      }
      
      // Cargar el archivo MIDI después de que la página termine de cargar
      window.addEventListener('load', function(){
        const midiUrl = './include/midiplayer/dance.mid';
        console.log('🎵 Cargando MIDI desde:', midiUrl);
        midiPlayer.handleURL(midiUrl);
      });
      
      console.log('✅ MIDI Player inicializado correctamente');
      
    } catch (error) {
      console.error('❌ Error inicializando reproductor MIDI:', error);
    }
    
    // === SISTEMA DE EFECTOS DE SONIDO (SFX) ===
    var sfxAudioContext = null;
    
    // Inicializar AudioContext para SFX
    try {
      var AudioContextSFX = window.AudioContext || window.webkitAudioContext;
      sfxAudioContext = new AudioContextSFX();
      console.log('✅ AudioContext para SFX inicializado');
    } catch (error) {
      console.error('❌ Error inicializando AudioContext para SFX:', error);
    }
    
    // Función para tocar una nota 8-bit
    function play8bitNote(frequency, duration, startTime, type) {
      if (!sfxAudioContext) return;
      
      var oscillator = sfxAudioContext.createOscillator();
      var gainNode = sfxAudioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(sfxAudioContext.destination);
      
      oscillator.type = type || 'square'; // Sonido 8-bit (square wave)
      oscillator.frequency.value = frequency;
      
      // Envelope ADSR para sonido más limpio
      var now = sfxAudioContext.currentTime + (startTime || 0);
      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.3, now + 0.01); // Attack
      gainNode.gain.linearRampToValueAtTime(0.2, now + 0.05); // Decay
      gainNode.gain.setValueAtTime(0.2, now + duration - 0.05); // Sustain
      gainNode.gain.linearRampToValueAtTime(0, now + duration); // Release
      
      oscillator.start(now);
      oscillator.stop(now + duration);
    }
    
    // SFX: Completar línea - "Truin!" (3 notas ascendentes)
    window.playLineClearSFX = function() {
      if (!sfxAudioContext) return;
      
      try {
        // Asegurar que el AudioContext esté corriendo
        if (sfxAudioContext.state === 'suspended') {
          sfxAudioContext.resume();
        }
        
        // Secuencia de 3 notas ascendentes tipo "truin!"
        // C5 -> E5 -> G5 (acorde de Do Mayor)
        play8bitNote(523.25, 0.08, 0, 'square');    // C5
        play8bitNote(659.25, 0.08, 0.08, 'square'); // E5
        play8bitNote(783.99, 0.15, 0.16, 'square'); // G5 (más larga)
        
        console.log('🎵 SFX: Línea completada');
      } catch (error) {
        console.error('❌ Error tocando SFX de línea:', error);
      }
    };
    
    // SFX: Bonus alcanzado - Sonido de power-up (melodía ascendente más elaborada)
    window.playBonusSFX = function() {
      if (!sfxAudioContext) return;
      
      try {
        // Asegurar que el AudioContext esté corriendo
        if (sfxAudioContext.state === 'suspended') {
          sfxAudioContext.resume();
        }
        
        // Secuencia tipo "power-up" - arpegio rápido ascendente
        // C5 -> E5 -> G5 -> C6 (más heroico)
        play8bitNote(523.25, 0.1, 0, 'square');     // C5
        play8bitNote(659.25, 0.1, 0.08, 'square');  // E5
        play8bitNote(783.99, 0.1, 0.16, 'square');  // G5
        play8bitNote(1046.50, 0.25, 0.24, 'triangle'); // C6 (octava arriba, sonido más suave)
        
        console.log('⭐ SFX: ¡Bonus alcanzado!');
      } catch (error) {
        console.error('❌ Error tocando SFX de bonus:', error);
      }
    };
    
    // SFX: Entrar en modo bonus - Chime de 2 notas brillante
    window.playEnterBonusSFX = function() {
      if (!sfxAudioContext) return;
      
      try {
        // Asegurar que el AudioContext esté corriendo
        if (sfxAudioContext.state === 'suspended') {
          sfxAudioContext.resume();
        }
        
        // Sonido brillante de 2 notas: E6 -> G6 (chime ascendente)
        play8bitNote(1318.51, 0.15, 0, 'sine');     // E6 - tono brillante
        play8bitNote(1567.98, 0.25, 0.12, 'sine');  // G6 - más agudo y sostenido
        
        console.log('💛 SFX: Entrando en modo bonus');
      } catch (error) {
        console.error('❌ Error tocando SFX de entrada a bonus:', error);
      }
    };
    
    // SFX: Subir de nivel - Fanfare corta de 4 notas
    window.playLevelUpSFX = function() {
      if (!sfxAudioContext) return;
      
      try {
        // Asegurar que el AudioContext esté corriendo
        if (sfxAudioContext.state === 'suspended') {
          sfxAudioContext.resume();
        }
        
        // Fanfare de nivel: G4 -> C5 -> E5 -> G5 (ascendente triunfal)
        play8bitNote(392.00, 0.12, 0, 'sawtooth');    // G4
        play8bitNote(523.25, 0.12, 0.1, 'sawtooth');  // C5
        play8bitNote(659.25, 0.12, 0.2, 'square');    // E5
        play8bitNote(783.99, 0.3, 0.3, 'triangle');   // G5 (largo y triunfal)
        
        console.log('🆙 SFX: ¡Subiste de nivel!');
      } catch (error) {
        console.error('❌ Error tocando SFX de nivel:', error);
      }
    };
    
    // Función para activar el flash visual de bonus
    window.triggerBonusFlash = function() {
      try {
        const flashOverlay = document.getElementById('bonus-flash-overlay');
        if (!flashOverlay) {
          console.warn('⚠️ Flash overlay no encontrado');
          return;
        }
        
        // Remover la clase si ya estaba activa (para reiniciar la animación)
        flashOverlay.classList.remove('flash-active');
        
        // Forzar reflow para reiniciar la animación
        void flashOverlay.offsetWidth;
        
        // Activar el flash
        flashOverlay.classList.add('flash-active');
        
        // Remover la clase después de la animación (1 segundo)
        setTimeout(() => {
          flashOverlay.classList.remove('flash-active');
        }, 1000);
        
        console.log('✨ Flash visual de bonus activado');
      } catch (error) {
        console.error('❌ Error activando flash visual:', error);
      }
    };
    
    // Función para iniciar la música (llamada cuando el juego empieza)
    window.startMusic = function() {
      try {
        if (midiPlayer && !musicStarted) {
          console.log('🎵 Iniciando música...');
          midiPlayer.play();
          musicStarted = true;
        } else if (midiPlayer && musicStarted) {
          // Si ya se inició antes, simplemente continuar
          midiPlayer.play();
        } else if (!midiPlayer) {
          console.warn('⚠️ Reproductor MIDI no está inicializado');
        }
      } catch (error) {
        console.error('❌ Error iniciando música:', error);
      }
    };
    
    // Función para pausar la música
    window.pauseMusic = function() {
      try {
        if (midiPlayer) {
          midiPlayer.pause();
        }
      } catch (error) {
        console.error('❌ Error pausando música:', error);
      }
    };
    
    // Función para detener la música
    window.stopMusic = function() {
      try {
        if (midiPlayer) {
          midiPlayer.stop();
          musicStarted = false;
        }
      } catch (error) {
        console.error('❌ Error deteniendo música:', error);
      }
    };
    
    // Función para cambiar el tempo de la música (llamada desde TetrisGame)
    window.setMusicTempo = function(tempo) {
      try {
        if (midiPlayer) {
          musicTempo = tempo;
          midiPlayer.setTempo(tempo);
          console.log(`🎵 Tempo de música ajustado a: ${Math.round(tempo * 100)}%`);
        }
      } catch (error) {
        console.error('❌ Error ajustando tempo:', error);
      }
    };
    
    // Función para resetear el tempo
    window.resetMusicTempo = function() {
      try {
        if (midiPlayer) {
          musicTempo = 1.0;
          midiPlayer.setTempo(1.0);
          console.log('🎵 Tempo de música reseteado a 100%');
        }
      } catch (error) {
        console.error('❌ Error reseteando tempo:', error);
      }
    };
  </script>

  
  
</body>
